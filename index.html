<!doctype html>
<html lang="en">
<head>

<meta property="og:description" content="Everyday Vietnamese for visitors and newcomers: more than 1,000 words and phrases with Hà Nội pronunciation, quizzes, typing practice and a stick-figure guide.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%232f80d8%22/%3E%3Crect x=%225%22 y=%225%22 width=%2254%22 height=%2254%22 rx=%2210%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222%22/%3E%3Cg fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2232%22 cy=%2222%22 r=%227%22/%3E%3Cpath d=%22M32 29v14M21 35l11 3 11-3M32 43l-8 10M32 43l8 10%22/%3E%3C/g%3E%3C/svg%3E">
<title>Nói tiếng Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
/* Layout: one column. Lessons are Hà Nội street-name plates (blue panel, white inset line).
   Game layer stays quiet: one player card, a stick-figure guide called Que, medals on a plain grid. */
:root {
  --ground: #eef1f4;
  --surface: #ffffff;
  --ink: #14212f;
  --ink-2: #55626f;
  --line: #d3dae2;
  --plate: #1b4d8a;
  --plate-edge: #e9f0f8;
  --plate-ink: #ffffff;
  --link: #1b4d8a;
  --focus: #2a6bb8;
  --red: #b3322a;
  --ok: #1d7648;
  --ok-bg: #e1f2e8;
  --bad: #ae2a22;
  --bad-bg: #fae4e1;
  --scrim: rgba(14, 21, 29, .55);
  --font-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e151d; --surface: #16202b; --ink: #e8eef4; --ink-2: #9aa7b5; --line: #29374a;
    --plate: #245a9e; --plate-edge: #dce8f6; --plate-ink: #ffffff; --link: #8db8ee; --focus: #7fb0ee;
    --red: #ef8077; --ok: #6fcb98; --ok-bg: #13301f; --bad: #f28e86; --bad-bg: #3b1b19; --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e151d; --surface: #16202b; --ink: #e8eef4; --ink-2: #9aa7b5; --line: #29374a;
  --plate: #245a9e; --plate-edge: #dce8f6; --plate-ink: #ffffff; --link: #8db8ee; --focus: #7fb0ee;
  --red: #ef8077; --ok: #6fcb98; --ok-bg: #13301f; --bad: #f28e86; --bad-bg: #3b1b19; --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 56px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app { max-width: 44rem; margin-inline: auto; display: grid; gap: 1.25rem; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: .5rem 1rem; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1.1; margin: 0; letter-spacing: -.01em; }
.brand small { display: block; margin-top: .3rem; font-family: var(--font-body); font-weight: 500; font-size: .8rem; color: var(--ink-2); letter-spacing: 0; }
.tally { margin: 0; color: var(--ink-2); font-size: .875rem; font-variant-numeric: tabular-nums; }
.tally b { color: var(--ink); }
.lead { margin: 0; max-width: 65ch; color: var(--ink-2); }

/* Street-name plate */
.plate { background: var(--plate); color: var(--plate-ink); padding: .35rem; border-radius: .6rem; }
.plate-in { border: .15rem solid var(--plate-edge); border-radius: .4rem; padding: .7rem 1rem .85rem; }
.kick { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.plate-title { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.15; margin: .1rem 0 0; text-wrap: balance; }
.plate.big .plate-title { font-size: clamp(1.9rem, 7vw, 2.5rem); }

.group { display: grid; gap: .75rem; }
.gh { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; width: 100%; padding: .35rem 0; }
.gh:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: .25rem; }
.gh .chev { width: 1rem; color: var(--ink-2); }
.gh .cnt { margin-left: auto; font-family: var(--font-body); font-size: .8rem; font-weight: 500; color: var(--ink-2); }
.group > h2 { font-family: var(--font-display); font-size: 1.15rem; margin: .5rem 0 0; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.group > h2 span { font-family: var(--font-body); font-weight: 400; font-size: .8125rem; color: var(--ink-2); }
.lessons { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); }
.lesson { display: grid; gap: .55rem; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; align-content: start; }
.lesson .plate { transition: transform .15s ease; }
.lesson:hover .plate { transform: translateY(-2px); }
.meta { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-size: .8125rem; color: var(--ink-2); padding-inline: .15rem; }
.meta span { font-variant-numeric: tabular-nums; }
.bar { height: .35rem; background: var(--line); border-radius: 1rem; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--plate); border-radius: 1rem; transition: width .3s ease; }

.sub { margin: 0; font-weight: 600; }
.tip { margin: 0; max-width: 65ch; color: var(--ink-2); }
.back, .link { background: none; border: 0; padding: .4rem 0; color: var(--link); text-decoration: underline; cursor: pointer; font-size: .9rem; text-align: left; }

/* Cards on the home screen */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; padding: .9rem 1rem; display: grid; gap: .6rem; }
.panel h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; }
.panel p { margin: 0; color: var(--ink-2); font-size: .9rem; }
.toolbar { display: flex; gap: .6rem 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: .6rem; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: .4rem .85rem; cursor: pointer; font-size: .875rem; min-height: 2.25rem; }
.seg button[aria-pressed="true"] { background: var(--plate); color: var(--plate-ink); font-weight: 600; }
.search { width: 100%; min-height: 2.75rem; padding: .55rem .9rem; border: 1px solid var(--line); border-radius: .6rem; background: var(--surface); color: var(--ink); font: inherit; }
.search::placeholder { color: var(--ink-2); }
.results { display: grid; border: 1px solid var(--line); border-radius: .75rem; background: var(--surface); overflow: hidden; }
.results .none { padding: .9rem; color: var(--ink-2); }
.hit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; align-items: center; padding: .65rem .9rem; border-top: 1px solid var(--line); }
.hit:first-child { border-top: 0; }
.hit .tag { font-size: .75rem; color: var(--ink-2); }

/* Player card and guide */
.player { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .5rem 1rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; padding: .9rem 1rem; }
.mascot { display: block; color: var(--ink); flex: none; }
.mascot svg { display: block; overflow: visible; }
.who { display: grid; gap: .45rem; min-width: 0; }
.bubble { position: relative; background: var(--ground); border-radius: .7rem; padding: .45rem .8rem; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -.35rem; top: .85rem; width: .7rem; height: .7rem; background: inherit; transform: rotate(45deg); }
.bubble b { font-weight: 700; }
.bubble small { display: block; color: var(--ink-2); font-size: .8125rem; }
.lvl { display: flex; align-items: baseline; gap: .1rem .6rem; flex-wrap: wrap; }
.lvl b { font-family: var(--font-display); font-size: 1.15rem; }
.lvl span { color: var(--ink-2); font-size: .8125rem; }
.chips { display: flex; gap: .4rem 1rem; flex-wrap: wrap; align-items: center; font-size: .8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chips svg { vertical-align: -.2em; margin-right: .2rem; }
.player .btn { justify-self: start; grid-column: 1 / -1; }

/* Flashcard */
.flash {
  display: grid; place-items: center; width: 100%; min-height: 16rem; padding: 1.5rem 1.25rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: .9rem;
  text-align: center; cursor: pointer;
}
.face { display: grid; gap: .7rem; justify-items: center; min-width: 0; max-width: 100%; }
.word { font-weight: 700; font-size: clamp(2rem, 9vw, 3.25rem); line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.hint { font-size: .8125rem; color: var(--ink-2); }
.gloss { font-weight: 600; font-size: 1.5rem; line-height: 1.25; text-wrap: balance; }
.note { color: var(--ink-2); font-size: .9rem; max-width: 40ch; }
.ex { border-top: 1px solid var(--line); padding-top: .7rem; width: 100%; max-width: 30rem; }
.ex .vi { font-weight: 600; }
.ex .en { color: var(--ink-2); font-size: .9rem; }
.chip { display: inline-block; padding: .15rem .6rem; border: 1px solid var(--red); color: var(--red); border-radius: 2rem; font-size: .8125rem; font-weight: 600; }
.how { font-size: .875rem; color: var(--ink-2); max-width: 36ch; }
@media (prefers-reduced-motion: no-preference) {
  .face { animation: pop .16s ease-out; }
  .hop svg { animation: hop .55s ease-in-out 2; transform-origin: 50% 100%; }
}
@keyframes pop { from { opacity: .4; transform: scale(.98); } to { opacity: 1; transform: none; } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

.ctrl { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.ctrl .count { margin-inline: auto; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .9rem; }
.btn {
  display: inline-flex; align-items: center; gap: .45rem; min-height: 2.75rem; padding: .5rem 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: .55rem; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--plate); }
.btn.primary { background: var(--plate); border-color: var(--plate); color: var(--plate-ink); font-weight: 600; }
.btn.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.btn.off { color: var(--ink-2); border-style: dashed; cursor: not-allowed; }
.btn.small { min-height: 2.25rem; padding: .25rem .7rem; font-size: .875rem; }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

.sec { font-family: var(--font-display); font-size: 1.15rem; margin: .5rem 0 0; }
.phrases { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: .75rem; background: var(--surface); overflow: hidden; }
.phrases li { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding: .7rem .9rem; border-top: 1px solid var(--line); }
.phrases li:first-child { border-top: 0; }
.dot { width: 1.1rem; height: 1.1rem; border: 1.5px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: .7rem; line-height: 1; }
.dot.k { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.pv { font-weight: 600; overflow-wrap: anywhere; }
.pe { color: var(--ink-2); font-size: .875rem; overflow-wrap: anywhere; }

.cult { border: 1px dashed var(--line); border-radius: .6rem; padding: .7rem .9rem; display: grid; gap: .15rem; background: var(--surface); }
.cult .k2 { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
.cult b { font-weight: 700; }
.cult p { margin: 0; color: var(--ink-2); font-size: .9rem; max-width: 65ch; }
.banner { display: flex; gap: .6rem 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--plate); border-radius: .7rem; padding: .6rem .9rem; font-size: .9rem; }
.pick { display: grid; gap: .4rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
.pick button { text-align: left; padding: .5rem .8rem; background: var(--surface); border: 1.5px solid var(--line); border-radius: .6rem; cursor: pointer; font-size: .9rem; min-width: 0; }
.pick button[aria-pressed="true"] { border-color: var(--plate); box-shadow: 0 0 0 1px var(--plate); }
.pron-out { display: flex; gap: .6rem 1.5rem; flex-wrap: wrap; align-items: baseline; padding: .6rem .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; }
.pron-out b { font-family: var(--font-display); font-size: 1.35rem; }

/* Dialogues */
.lines { display: grid; border: 1px solid var(--line); border-radius: .75rem; background: var(--surface); overflow: hidden; }
.line { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr) auto; gap: .6rem; align-items: start; padding: .7rem .9rem; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; }
@media (max-width: 520px) { .line .btn.off .lb { display: none; } }
.sp { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; border: 1.5px solid var(--plate); color: var(--plate); }
.line.b .sp { background: var(--plate); color: var(--plate-ink); }
.role { font-size: .75rem; color: var(--ink-2); }

/* Quiz and typing */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
.qhead .count { color: var(--ink-2); font-size: .9rem; font-variant-numeric: tabular-nums; }
.prompt { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.2; margin: .25rem 0; text-wrap: balance; overflow-wrap: anywhere; }
.opts { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
.opt {
  display: flex; gap: .7rem; align-items: center; text-align: left; min-height: 3.25rem; padding: .6rem .9rem;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: .6rem; cursor: pointer; min-width: 0; overflow-wrap: anywhere;
}
.opt:hover:not([disabled]) { border-color: var(--plate); }
.opt .ltr { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-weight: 600; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .75rem; align-items: start; }
.fb .bubble { display: grid; gap: .5rem; justify-items: start; padding: .7rem .9rem; }
.fb .bubble.ok { background: var(--ok-bg); color: var(--ok); }
.fb .bubble.bad { background: var(--bad-bg); color: var(--bad); }
.fb .bubble.ok small, .fb .bubble.bad small { color: inherit; opacity: .85; }
.fb .big { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.2; }
.fb .vi { font-weight: 700; }
.fb .xp { font-size: .8125rem; font-weight: 600; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 3.5rem; line-height: 1; font-variant-numeric: tabular-nums; margin: 0; }
.missed { margin: 0; padding-left: 1.2rem; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .5rem 1rem; align-items: center; }
.res .bubble { display: grid; gap: .1rem; }
.typed { width: 100%; font: inherit; font-size: 1.35rem; padding: .7rem .9rem; border: 1.5px solid var(--line); border-radius: .6rem; background: var(--surface); color: var(--ink); }
.typed[disabled] { opacity: .8; }
.kbd { display: grid; gap: .4rem; }
.kbd .krow { display: flex; gap: .35rem; flex-wrap: wrap; }
.key { min-width: 2.6rem; min-height: 2.75rem; padding: .25rem .55rem; background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; cursor: pointer; font-size: 1.1rem; }
.key:hover { border-color: var(--plate); }
.key small { display: block; font-size: .625rem; color: var(--ink-2); line-height: 1; margin-top: .1rem; }
.key.tone { min-width: 3.1rem; }

/* Profile, outfits, badges */
.stage { display: grid; justify-items: center; gap: .4rem; background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; padding: 1rem; text-align: center; }
.stage .name { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }
.outfits { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); }
.outfit { display: grid; justify-items: center; gap: .15rem; padding: .6rem .4rem; background: var(--surface); border: 1.5px solid var(--line); border-radius: .75rem; cursor: pointer; text-align: center; min-width: 0; }
.outfit.on { border-color: var(--plate); box-shadow: 0 0 0 2px var(--plate); }
.outfit[disabled] { cursor: not-allowed; border-style: dashed; }
.outfit[disabled] .mascot { opacity: .4; }
.outfit .on-name { font-weight: 600; font-size: .875rem; }
.outfit .on-en { font-size: .75rem; color: var(--ink-2); }
.swatches { display: grid; gap: .5rem .25rem; grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (min-width: 40rem) { .swatches { grid-template-columns: repeat(9, minmax(0, 1fr)); } }
.swb { display: grid; justify-items: center; align-content: start; gap: .4rem; padding: .35rem .15rem; background: none; border: 0; cursor: pointer; color: var(--ink-2); font: inherit; min-width: 0; }
.swb .swl { font-size: .75rem; line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
.swb[aria-pressed="true"] .swl { color: var(--ink); font-weight: 600; }
.sw { display: block; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swb[aria-pressed="true"] .sw { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.badges { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); }
.badge { display: grid; justify-items: center; align-content: start; gap: .25rem; padding: .8rem .5rem; background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; text-align: center; min-width: 0; }
.badge.locked { border-style: dashed; }
.badge.locked .medal { opacity: .35; }
.badge .bn { font-weight: 700; font-size: .875rem; overflow-wrap: anywhere; }
.badge .bh { font-size: .75rem; color: var(--ink-2); }
.badge .bs { font-size: .75rem; font-weight: 600; color: var(--ok); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: .75rem; background: var(--surface); overflow: hidden; font-size: .875rem; }
.hist li { display: flex; justify-content: space-between; gap: .5rem; padding: .5rem .8rem; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hist li:first-child { border-top: 0; }

/* Celebration dialog */
.scrim { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.dialog { background: var(--surface); border-radius: 1rem; width: 100%; max-width: 22rem; padding: 1.25rem; display: grid; gap: .6rem; justify-items: center; text-align: center; }
.dialog h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.dialog p { margin: 0; color: var(--ink-2); }
.dialog .kick2 { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
.dialog .ctrl { justify-content: center; margin-top: .4rem; }

/* Author panel */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: .75rem; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th, td { text-align: left; padding: .5rem .75rem; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; color: var(--ink-2); font-weight: 600; }
tr.grp td { background: var(--ground); font-weight: 700; }
.st { font-weight: 600; }
.st.y { color: var(--ok); }
.st.n { color: var(--ink-2); }
.checks { margin: 0; padding-left: 1.2rem; max-width: 65ch; }

function shuffle(a, rng) {
  rng = rng || Math.random;
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));

/* ---------- Audio ---------- */
var audioOK = {};
var player = null;
/* Checks which recordings exist. Browsers cap how many media elements can be alive at once
   (about a thousand in some, far fewer in others), so probe a few at a time and release each one. */
var PROBE_PARALLEL = 10;
function probeAudio(items, onProgress) {
  return new Promise(function (resolve) {
    var n = items.length, next = 0, running = 0, finished = 0;
    if (!n) { resolve(); return; }
    function pump() { while (running < PROBE_PARALLEL && next < n) probeOne(items[next++]); }
    function probeOne(it) {
      var done = false, a = null, timer = null;
      running++;
      function fin(v) {
        if (done) return;
        done = true; clearTimeout(timer);
        audioOK[it.id] = v;
        if (a) { try { a.removeAttribute("src"); a.load(); } catch (e) {} a = null; }
        running--; finished++;
        if (onProgress && (finished === 100 || finished === 400) && finished < n) onProgress();
        if (finished === n) resolve(); else pump();
      }
      try {
        a = new Audio();
        a.preload = "metadata";
        a.addEventListener("loadedmetadata", function () { fin(true); });
        a.addEventListener("error", function () { fin(false); });
        timer = setTimeout(function () { fin(false); }, 5000);
        a.src = audioUrl(it);
      } catch (e) { fin(false); }
    }
    pump();
  });
}
function play(id) {
  if (audioOK[id] !== true) { say("No recording for this phrase yet."); return; }
  try {
    if (player) player.pause();
    player = new Audio("audio/" + id + ".mp3");
    player.play().catch(function () { say("The browser blocked playback. Tap again."); });
  } catch (e) { say("Could not play this recording."); }
}
var toastTimer = null;
function say(msg) {
  var t = document.getElementById("toast");
  t.firstElementChild.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
}

/* ---------- Questions ---------- */
function pickOthers(correct, pool, k, key, rng) {
  var seen = {}; seen[correct[key]] = true;
  var out = [];
  var sh = shuffle(pool, rng);
  for (var i = 0; i < sh.length && out.length < k; i++) {
    if (!seen[sh[i][key]]) { seen[sh[i][key]] = true; out.push(sh[i]); }
  }
  return out;
}
/* items: the words to ask about. ctx: { mode, ok (audio map), rng }. Each question is built from its own lesson. */
function makeQuestions(items, ctx) {
  var rng = ctx.rng || Math.random, mode = ctx.mode || "vi2en", ok = ctx.ok || {};
  return items.map(function (it) {
    var L = lessonById(it.lesson), pool = L.items;
    var base = mode === "en2vi" ? "en2vi" : "vi2en";
    var kinds;
    if (L.kind === "letters") { kinds = ["lword", "lname"]; if (ok[it.id] === true) kinds.push("listen", "listen"); }
    else { kinds = [base, base]; if (L.id === "b0") kinds.push("tone"); if (ok[it.id] === true) kinds.push("listen"); }
    var kind = kinds[Math.floor(rng() * kinds.length)];
    function others(key) {
      var d = pickOthers(it, pool, 3, key, rng);
      if (d.length < 3) {
        var taken = d.map(function (x) { return x[key]; });
        var rest = ALL.filter(function (x) { return x !== it && taken.indexOf(x[key]) < 0 && x[key] !== undefined; });
        d = d.concat(pickOthers(it, rest, 3 - d.length, key, rng));
      }
      return d;
    }
    var q = { kind: kind, item: it };
    var opts;
    if (kind === "vi2en") {
      q.prompt = "What does “" + it.vi + "” mean?";
      opts = others("en").map(function (o) { return { label: o.en, correct: false }; });
      opts.push({ label: it.en, correct: true });
    } else if (kind === "en2vi") {
      q.prompt = "How do you say “" + it.en + "”?";
      opts = others("vi").map(function (o) { return { label: o.vi, correct: false }; });
      opts.push({ label: it.vi, correct: true });
    } else if (kind === "tone") {
      q.prompt = "Which tone does “" + it.vi + "” carry?";
      var wrong = shuffle(TONE_ORDER.filter(function (t) { return t !== it.tone; }), rng).slice(0, 3);
      opts = wrong.map(function (t) { return { label: t + " (" + TONES[t].label.toLowerCase() + ")", correct: false }; });
      opts.push({ label: it.tone + " (" + TONES[it.tone].label.toLowerCase() + ")", correct: true });
    } else if (kind === "lword") {
      q.prompt = "Which word starts with “" + it.vi + "”?";
      opts = others("word").map(function (o) { return { label: o.word, correct: false }; });
      opts.push({ label: it.word, correct: true });
    } else if (kind === "lname") {
      q.prompt = "How is the letter “" + it.vi + "” read?";
      opts = others("name").map(function (o) { return { label: o.name, correct: false }; });
      opts.push({ label: it.name, correct: true });
    } else {
      q.prompt = "Listen, then choose what you hear.";
      q.audioId = it.id;
      /* letters that are read the same (I and Y) must not appear together, or two answers would be right */
      var heard = L.kind === "letters" ? pickOthers(it, pool.filter(function (x) { return x.name !== it.name; }), 3, "vi", rng) : others("vi");
      opts = heard.map(function (o) { return { label: o.vi, correct: false }; });
      opts.push({ label: it.vi, correct: true });
    }
    q.options = shuffle(opts, rng);
    return q;
  });
}

    var msg = good ? PRAISE[q.i % PRAISE.length] : COMFORT[q.i % COMFORT.length];
    var it = cur.item;
    var meaning = lessonById(it.lesson).kind === "letters" ? '<span class="vi">' + esc(it.vi) + '</span> is read “' + esc(it.name) + '”, as in ' + esc(it.word) + ' (' + esc(it.wordEn) + ').' : '<span class="vi">' + esc(it.vi) + '</span> means ' + esc(it.en) + '.';
    fb = '<div class="fb">' + mascot({ pose: good ? "cheer" : "oops", size: 56, hop: good }) +
      '<div class="bubble ' + (good ? "ok" : "bad") + '" role="status"><div><div class="big">' + msg[0] + '</div><small>' + msg[1] + '</small></div>' +
      '<div>' + meaning + '</div>' +
      (q.gained && good ? '<div class="xp">+' + q.gained + ' XP</div>' : '') +
      (audioOK[it.id] === true ? playBtn(it.id) : "") +
      '<button class="btn primary" data-act="nextq">' + (q.i + 1 === q.qs.length ? "See results" : "Next question") + '</button></div></div>';
  }
  var back = q.kind === "daily" ? '<button class="back" data-act="home">← Leave practice</button>' : '<button class="back" data-act="open" data-id="' + q.lesson + '">← Back to lesson</button>';
  return '<div class="qhead">' + back + '<span class="count">' + (q.kind === "daily" ? "Daily practice · " : "") + 'Question ' + (q.i + 1) + ' of ' + q.qs.length + '</span></div>' +
    '<div class="bar"><i style="width:' + Math.round((q.i + (answered ? 1 : 0)) / q.qs.length * 100) + '%"></i></div>' +
    '<h1 class="prompt" tabindex="-1">' + esc(cur.prompt) + '</h1>' +
    (cur.audioId ? '<div class="ctrl">' + playBtn(cur.audioId, "primary") + '</div>' : "") +
    '<div class="opts">' + opts + '</div>' + fb;
}

/* ---------- Sessions ---------- */
function openLesson(id, card) {
  var l = lessonById(id);
  state.lesson = id;
  state.card = card != null ? Math.max(0, Math.min(l.items.length - 1, card)) : (store.resume.lesson === id ? Math.min(store.resume.card, l.items.length - 1) : 0);
  state.flipped = false;
  store.resume = { lesson: id, card: state.card };
  save();
  go("lesson");
}
function startQuiz(lessonId) {
  var l = lessonById(lessonId);
  var items = shuffle(l.items).slice(0, 8);
  state.quiz = { kind: "quiz", lesson: lessonId, qs: makeQuestions(items, { mode: store.mode, ok: audioOK }), i: 0, picked: null, score: 0, missed: [], xp: 0, gained: 0 };
  go("quiz");
}
function startDaily() {
  var items = dailyItems();
  if (!items) { say("Learn a few words first."); return; }
  state.quiz = { kind: "daily", lesson: "", qs: makeQuestions(items, { mode: store.mode, ok: audioOK }), i: 0, picked: null, score: 0, missed: [], xp: 0, gained: 0 };
  go("quiz");
}
function startTyping(lessonId) {
  var l = lessonById(lessonId);
  var items = shuffle(l.items).slice(0, 8);
  state.typing = { lesson: lessonId, items: items, i: 0, val: "", status: null, tries: 0, score: 0, missed: [], xp: 0, gained: 0 };
  go("typing", "#typed");
}
function finishSession(kind, lessonId, score, total, missed, xp) {
  if (kind === "quiz" && (!store.best[lessonId] || score / total > store.best[lessonId].s / store.best[lessonId].t)) store.best[lessonId] = { s: score, t: total };
  if (kind === "quiz" && score === total && total >= 5) xp += gain("perfect", lessonId);
  touchDay(); logSession(kind, lessonId, score, total);
  checkBadges(); save();
  state.result = { kind: kind, lesson: lessonId, score: score, total: total, missed: missed, xp: xp };
  go("result");
}
function typingMatches(it, val) {
  var v = normAns(val);
  if (v === normAns(it.vi)) return true;
  var l = lessonById(it.lesson), key = normAns(shortEn(it.en));
  return !!l && l.items.some(function (o) { return o !== it && normAns(shortEn(o.en)) === key && normAns(o.vi) === v; });
}
function checkTyped() {
  var t = state.typing, it = t.items[t.i];
  var el = app.querySelector("#typed");
  if (el) t.val = el.value;
  if (!normAns(t.val)) { say("Type your answer first."); return; }
  if (typingMatches(it, t.val)) {
    t.status = "right"; t.score++;
    t.gained = gain("typing", it.id); t.xp += t.gained;
    srsUpdate(it, true); markToday(it.id);
  } else {
    t.tries++;
    if (t.tries >= 2) {
      t.status = "revealed"; t.missed.push(it); srsUpdate(it, false); markToday(it.id);
    } else t.status = fold(normAns(t.val)) === fold(normAns(it.vi)) ? "close" : "wrong";
  }
  save();
  render(t.status === "right" || t.status === "revealed" ? "[data-act=nextt]" : "#typed");
}

/* ---------- Events ---------- */
function typedEl() { return app.querySelector("#typed"); }
function setTyped(v, pos) {
  var el = typedEl();
  if (!el) return;
  el.value = v; state.typing.val = v;
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}
function updateSearch() {
  var r = app.querySelector("#results"), b = app.querySelector("#browse");
  if (!r || !b) return;
  var q = state.query.trim();
  b.hidden = !!q; r.hidden = !q;
  r.innerHTML = q ? resultsHtml(q) : "";
}

app.addEventListener("input", function (e) {
  if (e.target.id === "uname") {
    store.name = String(e.target.value).slice(0, 20); save();
    var pn = document.getElementById("pname"); if (pn) pn.textContent = playerName();
  }
  if (e.target.id === "typed" && state.typing) state.typing.val = e.target.value;
  if (e.target.id === "q") { state.query = e.target.value; updateSearch(); }
});
function keepFocus(e) { if (e.target.closest && e.target.closest(".key")) e.preventDefault(); }
app.addEventListener("mousedown", keepFocus);
app.addEventListener("pointerdown", keepFocus);

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
  if (act === "open") { var c = t.getAttribute("data-card"); openLesson(id, c != null ? Number(c) : undefined); }
  else if (act === "goto") { var gi = itemById(id), gl = lessonById(gi.lesson); openLesson(gl.id, gl.items.indexOf(gi)); state.flipped = true; render("h1"); }
  else if (act === "grp") { state.closed[id] = !state.closed[id]; render("[data-act=grp][data-id=" + id + "]"); }
  else if (act === "home") { state.confirmReset = false; go("home"); }
  else if (act === "author") go("author");
  else if (act === "me") go("me");
  else if (act === "dialogue") { state.dlg = id; go("dialogue"); }
  else if (act === "toggleen") { state.showEn = !state.showEn; render("[data-act=toggleen]"); }
  else if (act === "mode") { store.mode = t.getAttribute("data-m"); save(); state.flipped = false; render("[data-m=" + store.mode + "]"); }
  else if (act === "flip") { state.flipped = !state.flipped; render("[data-act=flip]"); }
  else if (act === "prev" || act === "next") {
    var n = lessonById(state.lesson).items.length;
    state.card = (state.card + (act === "next" ? 1 : n - 1)) % n;
    state.flipped = false;
    store.resume = { lesson: state.lesson, card: state.card }; save();
    render("[data-act=" + act + "]");
  }
  else if (act === "known") {
    var it = lessonById(state.lesson).items[state.card];
    if (store.known[it.id]) delete store.known[it.id];
    else {
      store.known[it.id] = true;
      var g = gain("known", it.id);
      if (!store.srs[it.id]) store.srs[it.id] = { b: 1, d: dayAdd(today(), 1) };
      markToday(it.id);
      if (g) say("+" + g + " XP");
    }
    checkBadges(); save(); render("[data-act=known]");
  }
  else if (act === "pron") { state.pron = Number(t.getAttribute("data-i")); render("[data-act=pron][data-i='" + state.pron + "']"); }
  else if (act === "play") play(id);
  else if (act === "quiz") startQuiz(state.lesson);
  else if (act === "typing") startTyping(state.lesson);
  else if (act === "daily") startDaily();
  else if (act === "skipgate") { store.gateSkip = today(); save(); render("h1"); }
  else if (act === "again") { var r = state.result; if (r.kind === "daily") startDaily(); else if (r.kind === "typing") startTyping(r.lesson); else startQuiz(r.lesson); }
  else if (act === "answer") {
    var q = state.quiz;
    if (q.picked !== null) return;
    q.picked = Number(t.getAttribute("data-i"));
    var cur = q.qs[q.i], qi = cur.item;
    q.gained = 0;
    if (cur.options[q.picked].correct) {
      q.score++;
      var first = gain("quiz", qi.id);
      var rev = q.kind === "daily" ? (first ? 0 : gain("review", qi.id + "@" + today())) : 0;
      q.gained = first || rev; q.xp += q.gained;
      srsUpdate(qi, true);
    } else { q.missed.push(qi); srsUpdate(qi, false); }
    markToday(qi.id); save();
    render("[data-act=nextq]");
  }
  else if (act === "nextq") {
    var qz = state.quiz;
    if (qz.i + 1 < qz.qs.length) { qz.i++; qz.picked = null; qz.gained = 0; go("quiz"); }
    else finishSession(qz.kind, qz.lesson, qz.score, qz.qs.length, qz.missed, qz.xp);
  }
  else if (act === "check") checkTyped();
  else if (act === "nextt") {
    var ty = state.typing;
    if (ty.i + 1 < ty.items.length) { ty.i++; ty.val = ""; ty.status = null; ty.tries = 0; ty.gained = 0; go("typing", "#typed"); }
    else finishSession("typing", ty.lesson, ty.score, ty.items.length, ty.missed, ty.xp);
  }
  else if (act === "ins") {
    var el = typedEl(); if (!el) return;
    var ch = t.getAttribute("data-ch"), s0 = el.selectionStart == null ? el.value.length : el.selectionStart, e0 = el.selectionEnd == null ? s0 : el.selectionEnd;
    setTyped(el.value.slice(0, s0) + ch + el.value.slice(e0), s0 + ch.length);
  }
  else if (act === "bksp") {
    var el2 = typedEl(); if (!el2) return;
    var a = el2.selectionStart == null ? el2.value.length : el2.selectionStart, b = el2.selectionEnd == null ? a : el2.selectionEnd;
    if (a === b && a > 0) a--;
    setTyped(el2.value.slice(0, a) + el2.value.slice(b), a);
  }
  else if (act === "tone") {
    var el3 = typedEl(); if (!el3) return;
    var v = el3.value, pos = el3.selectionStart == null ? v.length : el3.selectionStart;
    var left = v.lastIndexOf(" ", pos - 1) + 1, right = v.indexOf(" ", pos); if (right < 0) right = v.length;
    var nw = applyTone(v.slice(left, right), t.getAttribute("data-t"));
    setTyped(v.slice(0, left) + nw + v.slice(right), left + nw.length);
  }
  else if (act === "wear" || act === "wearnew") {
    store.outfit = id; save();
    if (act === "wearnew") celebrate.shift();
    render(act === "wear" ? "[data-id=" + id + "]" : "h1");
  }
  else if (act === "color") { store.color = Number(t.getAttribute("data-i")); save(); render("[data-act=color][data-i='" + store.color + "']"); }
  else if (act === "goal") { store.goal = Number(t.getAttribute("data-n")); save(); render("[data-act=goal][data-n='" + store.goal + "']"); }
  else if (act === "gate") { store.gate = t.getAttribute("data-v") === "1"; save(); render("[data-act=gate][data-v='" + (store.gate ? 1 : 0) + "']"); }
  else if (act === "missing") { state.onlyMissing = !state.onlyMissing; render("[data-act=missing]"); }
  else if (act === "dismiss") { celebrate.shift(); save(); render("h1"); }
  else if (act === "reset1") { state.confirmReset = true; render("[data-act=reset2]"); }
  else if (act === "reset0") { state.confirmReset = false; render("[data-act=reset1]"); }
  else if (act === "reset2") { store = freshStore(); celebrate = []; state.confirmReset = false; save(); go("home"); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && celebrate.length && state.view !== "quiz" && state.view !== "typing") { celebrate.shift(); render("h1"); return; }
  if (e.key === "Enter" && e.target && e.target.id === "typed" && state.typing && state.view === "typing") { e.preventDefault(); checkTyped(); return; }
  if (state.view !== "lesson" || celebrate.length) return;
  if (e.target && (e.target.id === "q" || e.target.tagName === "INPUT")) return;
  if (e.key === "ArrowRight") { var n = lessonById(state.lesson).items.length; state.card = (state.card + 1) % n; state.flipped = false; store.resume = { lesson: state.lesson, card: state.card }; save(); render(); }
  if (e.key === "ArrowLeft") { var m = lessonById(state.lesson).items.length; state.card = (state.card + m - 1) % m; state.flipped = false; store.resume = { lesson: state.lesson, card: state.card }; save(); render(); }
});

render();
function refreshAfterProbe() {
  if (state.view === "typing") return;
  var active = document.activeElement;
  var keep = active && active.getAttribute && active.getAttribute("data-act");
  var typing = active && active.id === "q";
  if (typing) { var c = active.selectionStart; render(); var q2 = app.querySelector("#q"); if (q2) { q2.focus(); try { q2.setSelectionRange(c, c); } catch (e) {} } return; }
  render(keep ? "[data-act=" + keep + "]" : null);
}
probeAudio(AUDIO_ALL, refreshAfterProbe).then(refreshAfterProbe);
</script>
</body>
</html>
